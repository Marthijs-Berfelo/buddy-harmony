name: Release
on:
  workflow_call:
    secrets:
      APPROVE_TOKEN:
        required: true

jobs:
  complete:
    name: Merge PR
    runs-on: ubuntu-latest
    steps:
      - name: Obtain GitHub App Installation Access Token
        id: get_token
        run: |
          TOKEN="$(npx obtain-github-app-installation-access-token ci ${{ secrets.APPROVE_TOKEN }})"
          echo "::add-mask::$TOKEN"
          echo "approve_token=$TOKEN" >> $GITHUB_ENV

      - name: Merge Release PR
        run: gh pr merge "$PR_URL" --rebase
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ env.approve_token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ env.approve_token }}

      # The rebase-merge above gives the release commit a new SHA on main, orphaning the tag
      # release-it pushed on the release branch. Re-point the tag at main's HEAD so it stays an
      # ancestor for future `@release-it/conventional-changelog` compare-link lookups (#618).
      - name: Move release tag onto main
        run: |
          VERSION="${HEAD_REF#release/v}"
          git tag -f "$VERSION" HEAD
          git push origin "refs/tags/$VERSION" --force
        env:
          HEAD_REF: ${{ github.head_ref }}
