name: Credit contributor from comment

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write
  pull-requests: write

jobs:
  parse:
    name: Parse contributor request
    runs-on: ubuntu-latest
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    outputs:
      valid: ${{ steps.parse.outputs.valid }}
      username: ${{ steps.parse.outputs.username }}
      contributions: ${{ steps.parse.outputs.contributions }}
    steps:
      - name: Parse and validate comment
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const KNOWN_TYPES = [
              'a11y', 'audio', 'blog', 'bug', 'business', 'code', 'content', 'data', 'design', 'doc',
              'eventOrganizing', 'example', 'financial', 'fundingFinding', 'ideas', 'infra', 'maintenance',
              'mentoring', 'platform', 'plugin', 'projectManagement', 'question', 'research', 'review',
              'security', 'talk', 'test', 'tool', 'translation', 'tutorial', 'userTesting', 'video', 'promotion'
            ];
            const body = context.payload.comment.body.trim();
            const match = body.match(/^@all-contributors\s+please\s+add\s+@?([\w-]+)\s+for\s+([\w,\s]+)$/i);

            const react = async (content) => {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content,
              });
            };

            if (!match) {
              core.setOutput('valid', 'false');
              return;
            }

            const username = match[1];
            const types = match[2].split(',').map((t) => t.trim().toLowerCase()).filter(Boolean);
            const invalid = types.filter((t) => !KNOWN_TYPES.includes(t));

            if (invalid.length > 0) {
              await react('-1');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Sorry, I don't recognize contribution type(s): \`${invalid.join(', ')}\`.\n\nAccepted types: ${KNOWN_TYPES.map((t) => `\`${t}\``).join(', ')}`,
              });
              core.setOutput('valid', 'false');
              return;
            }

            await react('+1');
            core.setOutput('valid', 'true');
            core.setOutput('username', username);
            core.setOutput('contributions', types.join(','));

  add-contributor:
    name: Credit contributor
    needs: parse
    if: needs.parse.outputs.valid == 'true'
    uses: ./.github/workflows/job.add-contributor.yaml
    with:
      username: ${{ needs.parse.outputs.username }}
      contributions: ${{ needs.parse.outputs.contributions }}
    secrets:
      ALL_CONTRIBUTORS_APP_TOKEN: ${{ secrets.ALL_CONTRIBUTORS_APP_TOKEN }}
