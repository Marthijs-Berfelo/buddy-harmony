# Triggered only by the milestone:closed webhook (no workflow_dispatch) - if the release step
# skips because main's last commit is itself a release commit, reopening/reclosing the milestone
# only retries successfully once a non-release commit has landed on main in between.
name: Milestone Release
on:
  milestone:
    types:
      - closed

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'

permissions:
  contents: read

jobs:
  test:
    name: QA
    uses: ./.github/workflows/job.test.yaml
  build:
    name: Build
    needs:
      - test
    uses: ./.github/workflows/job.build.yaml
  release:
    name: Release
    needs:
      - test
      - build
    uses: ./.github/workflows/job.release.yaml
    with:
      release_type: milestone
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_APP_TOKEN }}
