name: Coverage Reporter
on:
  workflow_run:
    workflows:
      - Build PR
      - Build MAIN
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  report:
    name: Report coverage
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Read PR number
        id: pr
        run: echo "number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        id: coverageComment
        if: ${{ github.event.workflow_run.name == 'Build PR' }}
        uses: MishaKav/jest-coverage-comment@v1.0.36
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          coverage-summary-path: ./coverage/coverage-summary.json
          title: QA Results
          summary-title: Test results
          badge-title: Coverage
          create-new-comment: true
          hide-summary: false
      - name: Read coverage for badge
        id: coverageBadge
        if: ${{ github.event.workflow_run.name == 'Build MAIN' }}
        uses: MishaKav/jest-coverage-comment@v1.0.36
        with:
          coverage-summary-path: ./coverage/coverage-summary.json
          hide-comment: true
      - name: Update the badge
        if: ${{ github.event.workflow_run.name == 'Build MAIN' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GISTS_TOKEN }}
          gistID: cf80179d3c1077b9c719e9e737992d38
          filename: buddy-harmony__main.json
          label: Coverage
          message: ${{ steps.coverageBadge.outputs.coverage }}%
          color: ${{ steps.coverageBadge.outputs.color }}
          namedLogo: typescript
