# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 5
      semver-major-days: 14
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    reviewers:
      - "Marthijs-Berfelo"
    rebase-strategy: auto
    ignore:
      # eslint-plugin-react does not support eslint 10 yet
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @eslint/js majors track eslint majors 1:1 - must stay pinned alongside it
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support typescript >=6.1 yet
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    # Each group below must stay dependency-type-homogeneous (all prod, or all dev).
    # Dependabot's commit-message.prefix-development only applies when every
    # dependency in an update is a dev dependency - a mixed group would get
    # the "deps" prefix even if mostly dev tooling, misfiling it in the changelog.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
      react:
        patterns:
          - "react"
          - "react-dom"
      types-react:
        patterns:
          - "@types/react"
          - "@types/react-dom"
      testing-library:
        patterns:
          - "@testing-library/*"
      fortawesome:
        patterns:
          - "@fortawesome/*"
      i18next:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "globals"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      commitizen:
        patterns:
          - "commitizen"
          - "cz-conventional-changelog"
          - "cosmiconfig"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 5
    # Distinct "deps-ci" prefix (not "deps"/"deps-dev") because this ecosystem has no
    # prod/dev split (prefix-development isn't supported here), and CI tooling bumps
    # aren't user-facing release content - release-it hides deps-ci from the changelog.
    commit-message:
      prefix: "deps-ci"
    reviewers:
      - "Marthijs-Berfelo"
    rebase-strategy: auto
